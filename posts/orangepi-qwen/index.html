        <h1>香橙派 AIpro 部署 Qwen 实战笔记</h1>
        <p class="hero-copy">边缘设备跑大模型，关键不是一句“能跑”，而是环境、量化、推理和可复现步骤。</p>
        <figure class="article-cover"><img src="/img/4_orangepi-cover.jpg" alt="香橙派 AIpro"></figure>
      </header>
      <div class="article-body">
        <h2>部署关注点</h2>
        <p>硬件能力、系统镜像、驱动版本、推理框架和模型格式必须对齐。任何一个环节不清楚，后面都会变成排错。</p>
        <h2>实践路线</h2>
        <p>先确认 NPU 工具链，再编译推理框架，最后处理模型量化和推理参数。每一步都要留下版本号和命令记录。</p>
        <h2>复盘</h2>
        <p class="note">嵌入式 AI 的学习价值在于“把模型落到具体设备上”。跑通一次，比只看模型榜单更能建立工程直觉。</p>
